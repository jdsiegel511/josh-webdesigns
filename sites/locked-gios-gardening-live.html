<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Gio's Gardening Company - Website Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
        }
        .preview-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .blurred-preview {
            width: 100%;
            height: 100%;
            border: none;
            filter: blur(8px);
            pointer-events: none;
            user-select: none;
        }
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.95) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .lock-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 35px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .lock-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .lock-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .lock-card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .lock-card p.subtitle {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .stripe-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 16px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            margin-bottom: 25px;
            width: 100%;
        }
        .stripe-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -3px rgba(37, 99, 235, 0.4);
        }
        .zoom-link-container {
            margin-bottom: 25px;
        }
        .zoom-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: color 0.2s ease;
        }
        .zoom-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
        .contact-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .contact-info strong {
            color: #f1f5f9;
        }
        .contact-info a {
            color: #38bdf8;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        .powered-by {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
