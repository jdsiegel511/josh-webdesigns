<title>General K Construction - Website Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; }
.preview-wrapper { position: relative; width: 100%; }
.blurred-screenshot {
    width: 100%;
    filter: blur(8px) brightness(0.6);
    display: block;
}
.lock-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 26, 46, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}
.lock-card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.lock-icon { font-size: 3rem; margin-bottom: 15px; }
.lock-card h1 {
    font-size: 1.5rem;
    color: #1a1a2e;
    margin-bottom: 12px;
    font-weight: 800;
}
.lock-card p {
    font-size: 0.95rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
}
.price-tag {
    display: inline-block;
    background: #f0f4ff;
    border: 2px solid #3b82f6;
    border-radius: 12px;
    padding: 12px 30px;
    font-size: 2rem;
    font-weight: 800;
    color: #1a1a2e;
    margin-bottom: 20px;
}
.pay-button {
    display: block;
    background: #3b82f6;
    color: #fff;
    padding: 16px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 10px;
    transition: background 0.2s;
}
.pay-button:hover { background: #2563eb; }
.calendly-button {
    display: block;
    background: #fff;
    color: #1a1a2e;
    border: 2px solid #1a1a2e;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 15px;
}
.contact-info {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #eee;
    color: #666;
    font-size: 0.85rem;
}
.contact-info a {
    color: #3b82f6;
    text-decoration: none;
    font-weight: 600;
}
</style>
