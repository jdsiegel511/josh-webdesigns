    justify-content: center;

    z-index: 100;

.lock-card {

    margin-bottom: 12px;
    font-weight: 800;
}

    font-size: 0.95rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
}
.price-tag {
    display: inline-block;
    background: #f0f4ff;
    border: 2px solid #3b82f6;
    border-radius: 12px;
    padding: 12px 30px;
    font-size: 2rem;
    font-weight: 800;
    color: #1a1a2e;
    margin-bottom: 20px;
}
.pay-button {
    display: block;
    background: #3b82f6;
    color: #fff;
    padding: 16px;
    border-radius: 10px;

    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 10px;
    transition: background 0.2s;

.pay-button:hover { background: #2563eb; }
.calendly-button {
    display: block;
    background: #fff;
    color: #1a1a2e;
    border: 2px solid #1a1a2e;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 15px;
}

    margin-top: 15px;
    padding-top: 15px;

    color: #666;
    font-size: 0.85rem;

.contact-info a {
    color: #3b82f6;

    font-weight: 600;
