    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
}

    display: inline-block;
    background: #f0f4ff;
    border: 2px solid #3b82f6;
    border-radius: 12px;
    padding: 12px 30px;
    font-size: 2rem;
    font-weight: 800;
    color: #1a1a2e;
    margin-bottom: 20px;

    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 15px;
}

    color: #666;
